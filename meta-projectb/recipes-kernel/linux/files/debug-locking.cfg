# Bắt lỗi khóa khi phát triển driver (tuần 4–8). Chỉ áp khi PROJECTB_KERNEL_DEBUG = "1".
# PROVE_LOCKING tự select LOCKDEP, DEBUG_SPINLOCK, DEBUG_LOCK_ALLOC, DEBUG_RT_MUTEXES,
# TRACE_IRQFLAGS...: kích thước spinlock_t đổi, module phải build lại cùng kernel này.
# Không dùng kernel có fragment này để đo thời gian.
CONFIG_PROVE_LOCKING=y
CONFIG_DEBUG_ATOMIC_SLEEP=y
