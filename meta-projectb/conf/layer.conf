# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-projectb"
BBFILE_PATTERN_meta-projectb = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-projectb = "6"

# yoctobsp (meta-yocto-bsp): định nghĩa MACHINE beaglebone-yocto mà layer này nhắm tới
# (projectb-phy-retry có COMPATIBLE_MACHINE = "beaglebone-yocto").
LAYERDEPENDS_meta-projectb = "core yoctobsp"
LAYERSERIES_COMPAT_meta-projectb = "walnascar"
