default Yocto
label Yocto
   kernel /zImage
   fdtdir /
   # MPU6050 overlay, applied by U-Boot (pxe_utils.c) at fdtoverlay_addr_r.
   # Needs the base dtb built with -@ (KERNEL_DTC_FLAGS in the kernel bbappend).
   fdtoverlays /overlays/mpu6050.dtbo
   append root=/dev/mmcblk0p2 rootwait console=ttyS0,115200
